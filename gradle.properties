org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Maven Central/Cloudflare intermittently resets pooled keep-alive connections
# under concurrent dependency resolution ("Remote host terminated the handshake").
# Retry transient failures and avoid reusing stale pooled connections.
systemProp.http.keepAlive=false
systemProp.https.keepAlive=false
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
