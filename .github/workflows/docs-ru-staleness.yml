name: Docs-ru Staleness

on:
  push:
    paths:
      - 'docs-ru/**'
      - 'tools/docs-ru/check_staleness.py'
      - '.github/workflows/docs-ru-staleness.yml'
  pull_request:
    paths:
      - 'docs-ru/**'
      - 'tools/docs-ru/check_staleness.py'
      - '.github/workflows/docs-ru-staleness.yml'

permissions:
  contents: read

jobs:
  translation-staleness:
    name: Translation source-pin staleness check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history for pinned revisions
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Warn when translated English sources changed
        run: python3 tools/docs-ru/check_staleness.py

      - name: Test staleness warning behavior
        run: python3 -m unittest discover -s tools/docs-ru/tests -p 'test_staleness.py' -v
