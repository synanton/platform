name: Unicode Control Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unicode-controls:
    name: Reject bidi/zero-width controls in changed files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_unicode_controls.py --base "$BASE_SHA" --head "$HEAD_SHA"
