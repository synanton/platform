name: Prometheus Validation

on:
  push:
  pull_request:

jobs:
  promtool:
    name: Validate Rules and Runbooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus rules syntax
        run: |
          docker run --rm -v "$PWD:/work" -w /work prom/promtool:v2.55.0 \
            sh -c 'promtool check rules deployment/observability/prometheus/rules/*.yml'

      - name: Verify runbook links presence
        run: |
          set -euo pipefail
          missing=0
          
          for file in deployment/observability/prometheus/rules/*.yml; do
            [ -e "$file" ] || continue  
          
            while read -r line; do
              slug=$(echo "$line" | sed -n 's/.*runbooks\/\([^"]*\).*/\1/p')
              if [ -n "$slug" ] && [ ! -f "docs/operations/runbooks/${slug}.md" ]; then
                echo "❌ Missing runbook file for slug: ${slug} (found in $file)"
                missing=1
              fi
            done < <(grep -E 'runbook: "https://synanton.org[^"]+"' "$file" || true)
          done
          
          if [ "$missing" -ne 0 ]; then
            echo "🚨 Build failed: One or more markdown runbooks are missing in docs/operations/runbooks/"
            exit 1
          fi
          
          echo "✅ All runbooks are present."

