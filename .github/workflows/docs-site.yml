name: Docs Site (MkDocs)

on:
  push:
    branches: [ "main", "SNTP-11-Documentation" ]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Guides Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs and plugins
        run: pip install -r docs-site/requirements.txt

      - name: Build site (strict — fails on broken links/nav)
        run: mkdocs build -f docs-site/mkdocs.yml --strict

  deploy:
    name: Publish to synanton.github.io
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/SNTP-11-Documentation' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout guide sources (this repo)
        uses: actions/checkout@v4

      - name: Set up Python (for token creation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Inline creation of GitHub App installation token (no external actions)
      - name: Create GitHub App installation token (inline)
        id: create_token
        env:
          SYNANTON_PAGES_APP_ID: ${{ secrets.SYNANTON_PAGES_APP_ID }}
          SYNANTON_PAGES_APP_PRIVATE_KEY: ${{ secrets.SYNANTON_PAGES_APP_PRIVATE_KEY }}
          SYNANTON_PAGES_INSTALLATION_ID: ${{ secrets.SYNANTON_PAGES_INSTALLATION_ID }}
        run: |
          pip install PyJWT requests
          python - <<'PY'
          import time, jwt, requests, os, sys
          app_id = os.environ['SYNANTON_PAGES_APP_ID']
          key = os.environ['SYNANTON_PAGES_APP_PRIVATE_KEY']
          inst_id = os.environ['SYNANTON_PAGES_INSTALLATION_ID']
          now = int(time.time())
          payload = {"iat": now - 60, "exp": now + 600, "iss": str(app_id)}
          jwt_token = jwt.encode(payload, key, algorithm="RS256")
          if isinstance(jwt_token, bytes):
              jwt_token = jwt_token.decode('utf-8')
          headers = {"Authorization": f"Bearer {jwt_token}", "Accept": "application/vnd.github+json"}
          url = f"https://api.github.com/app/installations/{inst_id}/access_tokens"
          r = requests.post(url, headers=headers)
          if r.status_code != 201:
              print("ERROR creating installation token", r.status_code, r.text, file=sys.stderr)
              sys.exit(1)
          token = r.json().get("token")
          expires_at = r.json().get("expires_at")
          # write outputs for subsequent steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"token={token}\n")
              fh.write(f"expires_at={expires_at}\n")
          print("Created installation token, expires_at:", expires_at)
          PY

      - name: Checkout synanton.github.io (publish target) using installation token
        uses: actions/checkout@v4
        with:
          repository: synanton/synanton.github.io
          token: ${{ steps.create_token.outputs.token }}
          path: synanton.github.io
          fetch-depth: 0

      - name: Install MkDocs, plugins and mike
        run: pip install -r docs-site/requirements.txt mike

      - name: Configure git identity for actions
        working-directory: synanton.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute deploy version and alias policy
        id: vars
        run: |
          REF="${GITHUB_REF}"
          if [[ "$REF" == refs/tags/* ]]; then
            VERSION="${REF#refs/tags/}"
            UPDATE_ALIASES=true
          elif [[ "$REF" == refs/heads/main ]]; then
            VERSION="main-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
            UPDATE_ALIASES=true
          else
            BRANCH="${REF#refs/heads/}"
            SAFE_BRANCH="${BRANCH//\//-}"
            VERSION="${SAFE_BRANCH}-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
            UPDATE_ALIASES=false
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "update_aliases=${UPDATE_ALIASES}" >> $GITHUB_OUTPUT
          echo "Computed version=${VERSION}, update_aliases=${UPDATE_ALIASES}"

      - name: Deploy with mike
        working-directory: synanton.github.io
        run: |
          set -e
          VERSION='${{ steps.vars.outputs.version }}'
          UPDATE_ALIASES='${{ steps.vars.outputs.update_aliases }}'
          echo "Deploying version: $VERSION (update_aliases=$UPDATE_ALIASES)"
          if [ "$UPDATE_ALIASES" = "true" ]; then
            mike deploy --push --update-aliases -F ../docs-site/mkdocs.yml -b gh-pages "$VERSION" latest
            mike set-default --push -F ../docs-site/mkdocs.yml -b gh-pages latest
          else
            mike deploy --push -F ../docs-site/mkdocs.yml -b gh-pages "$VERSION"
          fi