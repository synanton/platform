server:
  port: 8080

spring:
  application:
    name: synapt
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

synapt:
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://gateway:8086}
    timeout-ms: 10000
  tenant:
    default-tenant: ${SYNAPT_DEFAULT_TENANT:demo}
  ui-security:
    csp-mode: enforce
  validation:
    strict: false

synanton:
  sanitizer:
    enabled: true
  envelope:
    # Downstream trust predicate (ADR-019 / #252): every business route
    # requires a security-context envelope validated by the security-provider.
    # Exempt operational routes are the exact EnvelopeExemptRoutes allowlist.
    enabled: true
    provider-url: ${SECURITY_PROVIDER_URL:http://security-provider:8080}
    issuer: synanton-security-provider
    # Single shared internal marker — not a per-service audience (ADR-019
    # dated correction). Carried for parity/logging, not replay protection.
    audience: synanton-internal
    cache-ttl-seconds: 60
    timeout-ms: 2000
