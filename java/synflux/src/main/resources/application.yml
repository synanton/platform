server:
  tomcat:
    max-http-form-post-size: ${SYNFLUX_TOMCAT_MAX_FORM_POST_SIZE:110MB}
    max-swallow-size: ${SYNFLUX_TOMCAT_MAX_SWALLOW_SIZE:110MB}
  port: 8090

spring:
  application:
    name: synflux
  task:
    scheduling:
      pool:
        # The extraction consumer can hold one scheduler thread for minutes.
        size: ${SPRING_TASK_SCHEDULING_POOL_SIZE:4}
  servlet:
    multipart:
      # The ingest business limit is 100 MB (synflux.ingest.max-file-size-bytes).
      # Spring's multipart default is 1 MB, which rejected every real book upload
      # with MaxUploadSizeExceededException/413; keep these aligned.
      max-file-size: ${SYNFLUX_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${SYNFLUX_MULTIPART_MAX_REQUEST_SIZE:110MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info

synflux:
  ingest:
    parallelism: 4
    max-file-size-bytes: 104857600
    chunk:
      # RQ1 switch: semantic is the running behavior (fixed-window was
      # test-only until the switch landed); override per deployment via
      # SYNFLUX_INGEST_CHUNK_STRATEGY for comparison legs.
      strategy: ${SYNFLUX_INGEST_CHUNK_STRATEGY:semantic}
      target-tokens: 400
      overlap-tokens: 50
  pipeline:
    enrichment-enabled: false
    embedding-enabled: false
    annotation-enabled: false
  embedding:
    # Must equal synquest's EMBED_MODEL. Vectors are stored at the model's native dimension;
    # synquest truncates (EMBED_TRUNCATE_DIM) at index/query time.
    model-id: ${EMBED_MODEL_ID:bge-base-en-v1.5}
    embed-base-url: ${EMBED_BASE_URL:http://vllm-embed:8001}
    batch-size: 32
  annotation:
    service-base-url: ${ANNOTATIONS_SERVICE_BASE_URL:http://localhost:8095}
    producer: rule-engine
    producer-version: "1.0"
  extraction-engine:
    # RAKG Phase B (ADR-022): regex is the safe default; llm uses the GPU plane.
    provider: ${EXTRACTION_PROVIDER:regex}
    endpoint: ${LLM_EXTRACTION_URL:http://localhost:8000/v1}
    model: ${LLM_EXTRACTION_MODEL:qwen3-extraction}
    timeout-seconds: ${LLM_EXTRACTION_TIMEOUT_SECONDS:120}
    consumer:
      # Safe default: disabled until the GPU plane and model are reachable.
      enabled: ${EXTRACTION_CONSUMER_ENABLED:false}
      tenant: ${EXTRACTION_CONSUMER_TENANT:demo}
      batch-documents: ${EXTRACTION_CONSUMER_BATCH_DOCUMENTS:1}
      max-attempts: ${EXTRACTION_CONSUMER_MAX_ATTEMPTS:5}
      retry-backoff-seconds: ${EXTRACTION_CONSUMER_RETRY_BACKOFF_SECONDS:30}
      poll-delay-ms: ${EXTRACTION_CONSUMER_POLL_DELAY_MS:5000}
    graph:
      # RAKG PR #3: validated mention/relation writes. Off until Syntology+Relix
      # are reachable; extraction still completes when this is false.
      enabled: ${EXTRACTION_GRAPH_ENABLED:false}
      syntology-url: ${SYNTOLOGY_BASE_URL:http://syntology:8080}
      relix-url: ${RELIX_BASE_URL:http://relix:8080}
      ontology-version: ${EXTRACTION_GRAPH_ONTOLOGY_VERSION:active}
      retry-poll-delay-ms: ${EXTRACTION_GRAPH_RETRY_POLL_DELAY_MS:30000}

synanton:
  extraction:
    client:
      enabled: ${EXTRACTION_CLIENT_ENABLED:false}
      endpoint: ${EXTRACTION_ENDPOINT:extraction-gateway:9091}
      mode: ${EXTRACTION_CLIENT_MODE:sync}
      deadline-seconds: ${EXTRACTION_DEADLINE_SECONDS:120}
      poll-interval-seconds: ${EXTRACTION_POLL_INTERVAL_SECONDS:5}
      fallback: ${EXTRACTION_FALLBACK:local-tika}
      default-priority: ${EXTRACTION_DEFAULT_PRIORITY:NORMAL}
  enrichment:
    model-id: llama-3.1-8b-instruct
    llm-base-url: ${LLM_BASE_URL:http://vllm-llm:8000}
    parallelism: 4

ingestion-cache:
  contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
  port: ${CASSANDRA_PORT:9042}
  keyspace: ingestion_cache
  local-dc: ${CASSANDRA_LOCAL_DC:datacenter1}

synvault:
  object-store:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: synanton-hot
    path-style-access: true
