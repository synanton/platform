synflux:
  pipeline:
    enrichment-enabled: true
    embedding-enabled: true
  enrichment:
    model-id: ${LLM_MODEL_ID:llama-3.1-8b-instruct}
    llm-base-url: ${LLM_BASE_URL:http://vllm-llm:8000}
    parallelism: ${ENRICH_PARALLELISM:4}
  embedding:
    model-id: ${EMBED_MODEL_ID:bge-base-en-v1.5}
    embed-base-url: ${EMBED_BASE_URL:http://vllm-embed:8001}
    batch-size: ${EMBED_BATCH_SIZE:32}
