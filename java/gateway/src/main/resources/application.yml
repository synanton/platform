server:
  port: 8086

spring:
  application:
    name: gateway
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

gateway:
  executor:
    parallelism: 8
  step-timeout-ms: 5000
  request-timeout-ms: 8000
  fusion:
    default-method: content_ref_intersection_first_then_rrf
    graph-promotion-bonus: 0.1
  planner:
    base-url: ${PLANNER_BASE_URL:http://planner:8085}
    timeout-ms: 3000
    retry-once-5xx: true
  synquest:
    base-url: ${SYNQUEST_BASE_URL:http://synquest:8083}
    timeout-ms: 5000
  relix:
    base-url: ${RELIX_BASE_URL:http://relix:8084}
    timeout-ms: 5000
  synthesis:
    enabled: false
    context-hits: 10
    max-context-tokens: 3000
    timeout-ms: 8000
    temperature: 0.3
    max-tokens: 150
    model: llama-3.1-8b-instruct
    base-url: ${LLM_BASE_URL:http://vllm-llm:8000/v1}
