server:
  port: 8089

spring:
  application:
    name: synanton-control-plane

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

control-plane:
  security-url: ${CONTROL_PLANE_SECURITY_URL:http://localhost:8081}
  topology-url: ${CONTROL_PLANE_TOPOLOGY_URL:http://localhost:8082}
  admin-scope: admin
  bootstrap-jwt: ${CONTROL_PLANE_SERVICE_JWT:}
  models:
    - model-id: llama-3.1-8b-instruct
      provider: openai-compat
      base-url: http://vllm-llm:8000/v1
      cost-per-token-usd: 0.0000003
      capabilities: [text-generation]
      status: active
    - model-id: bge-base-en-v1.5
      provider: openai-compat
      base-url: http://vllm-embed:8001/v1
      cost-per-token-usd: 0.0
      capabilities: [embedding]
      status: active
  http-client:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

logging:
  level:
    org.synanton.controlplane: INFO
