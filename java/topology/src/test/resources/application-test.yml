spring:
  datasource:
    url: jdbc:h2:mem:topology_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration-h2
    schemas: topology

topology:
  ontology-dir: /tmp/topology-test-ontologies
