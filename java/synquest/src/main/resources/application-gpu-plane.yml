# Opt-in profile: query embeddings via the GPU plane (gRPC synanton.gpu.v1 over mTLS).
# Activate with SPRING_PROFILES_ACTIVE=gpu-plane. Retrieval benchmark plan §6 Phase B1-G.
#
# EMBED_MODEL must be a LOGICAL model ID from the GPU Gateway catalog (GPU-7:
# synanton-free-embedding; GPU-5: synanton-bge-base-embedding), and must equal
# synflux's EMBED_MODEL_ID so the index only ever holds vectors from one model.
synquest:
  embedding:
    model: ${EMBED_MODEL:synanton-free-embedding}
    # GPU-7 free models are 2048-dim (nemotron) or 1024 (lfm); G0 chose 1024 for every arm:
    # nemotron needs truncation (2048 -> 1024), lfm is native 1024 (truncation is a no-op).
    dim: ${EMBED_DIM:1024}
    truncate-dim: ${EMBED_TRUNCATE_DIM:1024}
    # Re-running benchmark queries must not re-pay free-tier requests (G4); cleared on restart.
    query-cache-size: ${EMBED_QUERY_CACHE_SIZE:10000}
    # Fail closed: a failed query embedding fails the search (HTTP 503), never a silent BM25 fallback.
    required: ${EMBED_REQUIRED:true}

  # Cross-encoder reranking after RRF (retrieval benchmark B2, T10), via the GPU plane RERANK op.
  # prompt-format QWEN3 is required for Qwen3-Reranker (scores invert without the template).
  rerank:
    enabled: ${RERANK_ENABLED:false}
    model: ${RERANK_MODEL:synanton-qwen3-reranker-0.6b}
    prompt-format: ${RERANK_PROMPT_FORMAT:QWEN3}
    default-candidates: ${RERANK_CANDIDATES:50}

gpu-plane:
  endpoint: ${GPU_PLANE_ENDPOINT:gpu-gateway:9090}
  model-version: ${GPU_PLANE_MODEL_VERSION:latest}
  timeout-ms: ${GPU_PLANE_TIMEOUT_MS:60000}
  # Client-side pacing under the OpenRouter free-tier per-minute limit (~20/min); 0 = unlimited.
  max-requests-per-minute: ${GPU_PLANE_MAX_RPM:15}
  tls:
    enabled: ${GPU_TLS_ENABLED:true}
    ca-path: ${GPU_TLS_CA_PATH:}
    cert-path: ${GPU_TLS_CERT_PATH:}
    key-path: ${GPU_TLS_KEY_PATH:}
    authority: ${GPU_TLS_AUTHORITY:}
  retry:
    max-attempts: ${GPU_PLANE_RETRY_MAX_ATTEMPTS:3}
    backoff-base-ms: ${GPU_PLANE_RETRY_BACKOFF_MS:500}
    rate-limited-backoff-ms: ${GPU_PLANE_RATE_LIMITED_BACKOFF_MS:15000}
