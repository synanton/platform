server:
  port: 8083

spring:
  application:
    name: synquest
  task:
    scheduling:
      pool:
        size: ${SYNQUEST_SCHEDULER_POOL:2}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

ontology:
  v2:
    path: ${ONTOLOGY_V2_PATH:demo-data/eval/retrieval-benchmark/ontology-v2.jsonl}
    sha256: ${ONTOLOGY_V2_SHA256:00c7e8fb6e1385ffe97710c26523a720dbe57cd922653bf1d099e7dec051a389}

synquest:
  index:
    path: ${SYNQUEST_INDEX_PATH:./data/synquest}
    rebuild-on-boot-if-empty: true
    reader-refresh-seconds: 30
  search:
    default-top-k: 20
    default-top-k-dense: 100
    default-top-k-lexical: 100
    default-rrf-k: 60
    dense-similarity: COSINE
    # Single-leg RRF boost (F-tune option A): 1.0 = classic RRF; 2.0 boosts
    # DENSE-only hits to dual-leg parity (lexical-only hits keep classic
    # weight — boosting them promotes BM25 tail noise). Tune only against
    # gold; see RrfFusion.
    default-single-leg-boost: 1.0
    # Snippet length cap in chars (0 = full chunk text). Rerank evaluation
    # needs full text; UI previews want short. Default preserves behavior.
    snippet-chars: 200
    # Query-time tombstone filtering: retrieve limit + margin before the
    # final cut; hard-capped in the backend. Tune with hybrid fusion.
    tombstone-overfetch-margin: ${SYNQUEST_TOMBSTONE_OVERFETCH_MARGIN:100}
  seed:
    # Optional demo projection initialisation after a restart. Set to the demo
    # tenant (demo) so the existing index is loaded without a manual rebuild.
    demo-tenant: ${SYNQUEST_SEED_DEMO_TENANT:}
  embedding:
    model: ${EMBED_MODEL:bge-base-en-v1.5}
    # Dense index dimension (<= 1024, the Lucene 9.11 KNN cap). Changing it needs a /reindex.
    dim: ${EMBED_DIM:768}
    # 0 = off; else must equal dim: cut longer (Matryoshka) vectors to dim + L2-renormalise,
    # identically at index build and query time. Ingest stores native vectors.
    truncate-dim: ${EMBED_TRUNCATE_DIM:0}
    # LRU query-vector cache per (tenant, model, query); 0 = off.
    query-cache-size: ${EMBED_QUERY_CACHE_SIZE:0}
    normalise-l2: true

llm-client:
  embed:
    base-url: ${VLLM_EMBED_BASE_URL:http://vllm-embed:8001/v1}
    model: ${EMBED_MODEL:bge-base-en-v1.5}
    timeout-ms: 15000
    max-retries: 3

ingestion-cache:
  contact-points:
    - ${CASSANDRA_HOST:cassandra}
  port: ${CASSANDRA_PORT:9042}
  keyspace: ingestion_cache
  local-dc: ${CASSANDRA_LOCAL_DC:datacenter1}

resolution:
  # PR #4b.3. Scores are RRF retrieval scores, not probabilities; tune against
  # evaluation/resolution-fixture.jsonl, never by interpretation.
  policy-version: ${RESOLUTION_POLICY_VERSION:v1}
  absolute-threshold: ${RESOLUTION_ABSOLUTE_THRESHOLD:0.02}
  margin-threshold: ${RESOLUTION_MARGIN_THRESHOLD:0.001}
  consumer:
    # PR #4d.1: independent of extraction; disabled until Relix is in the stack.
    enabled: ${RESOLUTION_CONSUMER_ENABLED:false}
    tenant: ${RESOLUTION_CONSUMER_TENANT:}
    batch-mentions: ${RESOLUTION_CONSUMER_BATCH:10}
    max-attempts: ${RESOLUTION_CONSUMER_MAX_ATTEMPTS:5}
    retry-backoff-seconds: ${RESOLUTION_CONSUMER_BACKOFF_SECONDS:30}
    lease-seconds: ${RESOLUTION_CONSUMER_LEASE_SECONDS:300}
    poll-delay-ms: ${RESOLUTION_CONSUMER_POLL_DELAY_MS:5000}
    ontology-version: ${RESOLUTION_ONTOLOGY_VERSION:active}
