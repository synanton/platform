server:
  port: 8084

spring:
  application:
    name: relix
  task:
    scheduling:
      pool:
        size: ${RELIX_SCHEDULER_POOL:1}
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

relix:
  graph:
    load-on-boot: true
    tenant: ${RELIX_TENANT:demo}
    connector: ${RELIX_GRAPH_CONNECTOR:memory}
    neo4j:
      uri: ${NEO4J_URI:}
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}
      database: ${NEO4J_DATABASE:neo4j}
    nebula:
      graphd-hosts: ${NEBULA_GRAPHD_HOSTS:}
      username: ${NEBULA_USERNAME:root}
      password: ${NEBULA_PASSWORD:nebula}
      space: ${NEBULA_SPACE:synanton}
  reconciliation:
    # PR #578: Cassandra-driven crash-window repair. Keep disabled until validated.
    enabled: ${RECONCILIATION_ENABLED:false}
    tenant: ${RECONCILIATION_TENANT:}
    batch: ${RECONCILIATION_BATCH:100}
    poll-delay-ms: ${RECONCILIATION_POLL_DELAY_MS:60000}
    lease-seconds: ${RECONCILIATION_LEASE_SECONDS:120}
  promotion-consumer:
    # PR #4d.1: independent of extraction/resolution; disabled by default.
    enabled: ${PROMOTION_CONSUMER_ENABLED:false}
    tenant: ${PROMOTION_CONSUMER_TENANT:}
    batch-relations: ${PROMOTION_CONSUMER_BATCH:5}
    max-attempts: ${PROMOTION_CONSUMER_MAX_ATTEMPTS:5}
    retry-backoff-seconds: ${PROMOTION_CONSUMER_BACKOFF_SECONDS:30}
    lease-seconds: ${PROMOTION_CONSUMER_LEASE_SECONDS:120}
    poll-delay-ms: ${PROMOTION_CONSUMER_POLL_DELAY_MS:10000}
  query:
    entity-lookup-default-limit: 10
    one-hop-default-limit: 50
    k-hop-max-hops-cap: 6
    k-hop-max-paths-cap: 100

ingestion-cache:
  contact-points:
    - ${CASSANDRA_HOST:cassandra}
  port: ${CASSANDRA_PORT:9042}
  keyspace: ingestion_cache
  local-dc: ${CASSANDRA_LOCAL_DC:datacenter1}
  envelope:
    # Downstream trust predicate (ADR-019 / #252): every business route
    # requires a security-context envelope validated by the security-provider.
    # Exempt operational routes are the exact EnvelopeExemptRoutes allowlist.
    enabled: true
    provider-url: ${SECURITY_PROVIDER_URL:http://security-provider:8080}
    issuer: synanton-security-provider
    # Single shared internal marker — not a per-service audience (ADR-019
    # dated correction). Carried for parity/logging, not replay protection.
    audience: synanton-internal
    cache-ttl-seconds: 60
    timeout-ms: 2000
