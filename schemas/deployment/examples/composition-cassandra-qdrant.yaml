# VEC-B2.3 example: cassandra-qdrant (composition 3/6).
# Secret-bearing values by ${VAR} reference only (.env.default contract).
synquest:
  metadata:
    provider: cassandra
  vector:
    provider: qdrant
    endpoint_ref: "${BENCH_QDRANT_URL}"
  fusion:
    method: rrf
    rrf_k: 60
  execution:
    mode: parallel
    per_query_override: true
