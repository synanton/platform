# VEC-B2.3 example: cassandra-milvus (composition 2/6).
# Secret-bearing values by ${VAR} reference only (.env.default contract).
synquest:
  metadata:
    provider: cassandra
  vector:
    provider: milvus
    endpoint_ref: "${BENCH_MILVUS_URI}"
  fusion:
    method: rrf
    rrf_k: 60
  execution:
    mode: parallel
    per_query_override: true
