server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://security:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://syntology:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    location /topology/ {
        proxy_pass http://topology:8082/topology/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        proxy_pass http://synanton-mcp:8091/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /capabilities {
        proxy_pass http://syntology:8083/capabilities;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://syntology:8083/actuator/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
