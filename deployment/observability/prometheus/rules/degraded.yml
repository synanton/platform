groups:
  - name: degraded
    rules:
      - alert: SynfluxDegradedRecrawlStalled
        expr: changes(synflux_degraded_recrawl_progress[30m]) == 0
        labels: { severity: page }
        annotations:
          summary: "Degraded recrawl stalled"
          runbook: "https://docs.synanton.org/runbooks/degraded-mode"
      - alert: PlatformDegradedModeActive
        expr: gateway_degraded_mode_active == 1
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "Platform degraded mode active"
          runbook: "https://docs.synanton.org/runbooks/degraded-mode"
