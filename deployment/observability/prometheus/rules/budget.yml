groups:
  - name: budget
    rules:
      - alert: ForecastCostOverrunWarning
        expr: control_forecast_budget_days_remaining < 7
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "Tenant {{ $labels.tenant }} budget forecast < 7 days"
          runbook: "https://docs.synanton.dev/runbooks/budget-overrun"
      - alert: ForecastCostOverrunCritical
        expr: control_forecast_budget_days_remaining < 3
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "Tenant {{ $labels.tenant }} budget forecast < 3 days"
          runbook: "https://docs.synanton.dev/runbooks/budget-overrun"
      - alert: TenantBudgetExhausted
        expr: increase(gateway_budget_denied_total[5m]) > 0
        labels: { severity: page }
        annotations:
          summary: "Tenant budget exhausted"
          runbook: "https://docs.synanton.dev/runbooks/budget-exhausted"
