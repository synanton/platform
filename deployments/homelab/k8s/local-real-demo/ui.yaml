apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: synanton
spec:
  type: NodePort
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: synanton
  annotations:
    synanton.io/source-commit: 076d3a5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: ui
          image: local-registry:5000/synanton/ui@sha256:9d531ac585a4e372498318e77389b8e7caeb1d15c76e73cebfbd972afa8c1ffe
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
