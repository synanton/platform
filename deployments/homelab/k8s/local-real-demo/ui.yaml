apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: synanton
  annotations:
    synanton.io/source-commit: 3b6bcb1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: ui
          image: local-registry:5000/synanton/ui@sha256:604c007993328a714cba2c607deb1f129e1dafc9c2d4ab314997547b7ddb9656
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
