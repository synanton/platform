apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-demo-config
  namespace: synanton
data:
  SECURITY_DEMO_ISSUANCE_ENABLED: "true"
  SYNQUEST_EMBEDDING_REQUIRED: "false"
  SYNQUEST_SEED_DEMO_TENANT: "demo"
  SYNFLUX_PIPELINE_EMBEDDING_ENABLED: "true"
  # Query embeddings (synquest, OpenAI-compatible, needs /v1) and ingest embeddings
  # (synflux, EMBED_BASE_URL + /embeddings) both point at the in-cluster TEI service.
  VLLM_EMBED_BASE_URL: "http://tei-embedding.gpu-plane.svc.cluster.local:8000/v1"
  EMBED_BASE_URL: "http://tei-embedding.gpu-plane.svc.cluster.local:8000/v1"
