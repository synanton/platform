apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: synanton
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # The Service named "neo4j" injects NEO4J_PORT_* service-links, which the
      # Neo4j strict config parser treats as settings and rejects.
      enableServiceLinks: false
      imagePullSecrets:
        - name: local-registry-cred
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: local-registry:5000/synanton/neo4j:5.26
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-cred
                  key: auth
            - name: NEO4J_server_memory_heap_max__size
              value: 512M
            - name: NEO4J_server_memory_pagecache_size
              value: 256M
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "RETURN 1"'
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
