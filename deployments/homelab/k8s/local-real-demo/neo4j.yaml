apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: neo4j
  ports:
    - name: bolt
      port: 7687
      targetPort: bolt
    - name: http
      port: 7474
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: synanton
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      # The Service named "neo4j" injects NEO4J_PORT_* service-links, which the
      # Neo4j strict config parser treats as settings and rejects.
      enableServiceLinks: false
      imagePullSecrets:
        - name: local-registry-cred
      securityContext:
        fsGroup: 7474
      containers:
        - name: neo4j
          image: local-registry:5000/synanton/neo4j:5.26
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-cred
                  key: auth
            - name: NEO4J_server_memory_heap_max__size
              value: 512M
            - name: NEO4J_server_memory_pagecache_size
              value: 256M
          ports:
            - name: bolt
              containerPort: 7687
            - name: http
              containerPort: 7474
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}"
                  "SHOW CONSTRAINTS YIELD name WHERE name IN ['canonical_relation_anchor_unique','entity_identity_unique','extracted_mention_unique','extracted_relation_unique','relation_evidence_unique','resolution_slot_unique','source_revision_fence_unique'] RETURN count(*) AS c"
                  | grep -qw 7
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
        - name: schema-init
          image: local-registry:5000/synanton/neo4j:5.26
          imagePullPolicy: IfNotPresent
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: neo4j-cred
                  key: auth
          command: ["sh", "-c"]
          args:
            - |
              until cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null 2>&1; do sleep 2; done
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT extracted_mention_unique IF NOT EXISTS FOR (m:ExtractedMention) REQUIRE (m.tenant_id, m.mention_id) IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT resolution_slot_unique IF NOT EXISTS FOR (s:ResolutionSlot) REQUIRE (s.tenant_id, s.mention_id) IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT relation_evidence_unique IF NOT EXISTS FOR (e:RelationEvidence) REQUIRE e.evidence_id IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT canonical_relation_anchor_unique IF NOT EXISTS FOR (r:CanonicalRelationAnchor) REQUIRE r.canonical_relation_id IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT extracted_relation_unique IF NOT EXISTS FOR (r:ExtractedRelation) REQUIRE (r.tenant_id, r.relation_id) IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT entity_identity_unique IF NOT EXISTS FOR (e:Entity) REQUIRE (e.tenant, e.id) IS UNIQUE" >/dev/null
              cypher-shell -a bolt://localhost:7687 -u neo4j -p "${NEO4J_AUTH#*/}" "CREATE CONSTRAINT source_revision_fence_unique IF NOT EXISTS FOR (f:SourceRevisionFence) REQUIRE (f.tenant_id, f.source_id) IS UNIQUE" >/dev/null
              sleep infinity
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 10Gi
