apiVersion: v1
kind: Service
metadata:
  name: extraction-gateway
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: extraction-gateway
  ports:
    - name: grpc
      port: 9091
      targetPort: grpc
    - name: http
      port: 8092
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction-gateway
  namespace: synanton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extraction-gateway
  template:
    metadata:
      labels:
        app: extraction-gateway
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: gateway
          image: local-registry:5000/synanton/extraction-gateway@sha256:1f79c5991c395aab24e796e0500a2ed1f7c8dd21cd540ded4198eea29e8f65c2
          imagePullPolicy: IfNotPresent
          env:
            - name: EXTRACTION_DB_URL
              value: jdbc:postgresql://postgres:5432/synanton
            - name: EXTRACTION_DB_USER
              value: synanton
            - name: EXTRACTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cred
                  key: password
            - name: EXTRACTION_GATEWAY_GRPC_PORT
              value: "9091"
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: password
          ports:
            - name: grpc
              containerPort: 9091
            - name: http
              containerPort: 8092
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
