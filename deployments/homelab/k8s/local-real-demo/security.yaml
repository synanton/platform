apiVersion: v1
kind: Service
metadata:
  name: security
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: security
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security
  namespace: synanton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security
  template:
    metadata:
      labels:
        app: security
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: security
          image: local-registry:5000/synanton/security@sha256:fbf0dee18cde0d516e94c7c37315572c54f33270a495baa0fe501b5ecd76f3e4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tenant-demo-config
          env:
            - name: SYNANTON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synanton-jwt
                  key: secret
            - name: SECURITY_HTPASSWD_PATH
              value: /etc/synanton/users
            - name: SECURITY_DB_URL
              value: jdbc:postgresql://postgres:5432/synanton
            - name: SECURITY_DB_USER
              value: synanton
            - name: SECURITY_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-cred
                  key: password
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: htpasswd
              mountPath: /etc/synanton
              readOnly: true
      volumes:
        - name: htpasswd
          secret:
            secretName: security-htpasswd
