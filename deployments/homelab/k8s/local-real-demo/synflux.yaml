apiVersion: v1
kind: Service
metadata:
  name: synflux
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: synflux
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synflux
  namespace: synanton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synflux
  template:
    metadata:
      labels:
        app: synflux
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: synflux
          image: local-registry:5000/synanton/synflux@sha256:07f3ce9732f7d5e4cdb93b2fd5a8e611cd460bbad0820802349062b1f3b3efe1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tenant-demo-config
          env:
            - name: CASSANDRA_CONTACT_POINTS
              value: "cassandra-0.cassandra-headless.synanton.svc.cluster.local,cassandra-1.cassandra-headless.synanton.svc.cluster.local,cassandra-2.cassandra-headless.synanton.svc.cluster.local"
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_LOCAL_DC
              value: "datacenter1"
            - name: SERVER_PORT
              value: "8090"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: ""
            - name: SYNFLUX_CONTENT_CACHE_BACKEND
              value: filesystem
            - name: SYNFLUX_CONTENT_CACHE_ROOT
              value: /content-cache
            - name: SYNFLUX_FIXTURE_ROOT
              value: /fixtures
            - name: EXTRACTION_CLIENT_ENABLED
              value: "true"
            - name: EXTRACTION_ENDPOINT
              value: extraction-gateway:9091
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: password
            - name: SYNANTON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synanton-jwt
                  key: secret
          ports:
            - name: http
              containerPort: 8090
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: content-cache
              mountPath: /content-cache
            - name: fixtures
              mountPath: /fixtures
      securityContext:
        fsGroup: 101
      volumes:
        - name: content-cache
          persistentVolumeClaim:
            claimName: synflux-content-cache
        - name: fixtures
          emptyDir: {}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synflux-content-cache
  namespace: synanton
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
