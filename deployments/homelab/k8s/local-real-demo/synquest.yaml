apiVersion: v1
kind: Service
metadata:
  name: synquest
  namespace: synanton
spec:
  type: ClusterIP
  selector:
    app: synquest
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synquest
  namespace: synanton
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synquest
  template:
    metadata:
      labels:
        app: synquest
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: synquest
          image: local-registry:5000/synanton/synquest@sha256:fe1f792ff79f4b2edbb2ee749d793db2d395cd7a3b86dbf2d517e33bff7fa16a
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tenant-demo-config
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: CASSANDRA_HOST
              value: cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_LOCAL_DC
              value: datacenter1
            - name: SYNQUEST_INDEX_PATH
              value: /var/lib/synquest
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: password
            - name: SYNANTON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synanton-jwt
                  key: secret
          ports:
            - name: http
              containerPort: 8083
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: index
              mountPath: /var/lib/synquest
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: synquest-index-local-real-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synquest-index-local-real-demo
  namespace: synanton
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
