apiVersion: v1
kind: Service
metadata:
  name: synquest
  namespace: synanton
  annotations:
    synanton.io/source-commit: "2094371"
spec:
  type: ClusterIP
  selector:
    app: synquest
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synquest
  namespace: synanton
  annotations:
    synanton.io/source-commit: "2094371"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synquest
  template:
    metadata:
      labels:
        app: synquest
    spec:
      imagePullSecrets:
        - name: local-registry-cred
      containers:
        - name: synquest
          image: local-registry:5000/synanton/synquest@sha256:ffd40f16319a9d4d4704946ba98208f744fa29e13dd218976b41529a5f92f21b
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: tenant-demo-config
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: CASSANDRA_HOST
              value: cassandra
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_LOCAL_DC
              value: datacenter1
            - name: SYNQUEST_INDEX_PATH
              value: /var/lib/synquest
            - name: MINIO_ENDPOINT
              value: http://minio:9000
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-cred
                  key: password
            - name: SYNANTON_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: synanton-jwt
                  key: secret
            - name: ONTOLOGY_V2_PATH
              value: /app/data/ontology-v2.jsonl
            - name: ONTOLOGY_V2_SHA256
              value: 00c7e8fb6e1385ffe97710c26523a720dbe57cd922653bf1d099e7dec051a389
            - name: SYNQUEST_DEMO_DENSE_CACHE
              value: /app/data/dense-embeddings-v2.json
            - name: SYNQUEST_DEMO_QUERIES
              value: /app/data/queries-v2.rb-fixed-g5.jsonl
            - name: SYNQUEST_DEMO_GRAPH
              value: /app/data/graph-v2.json
          ports:
            - name: http
              containerPort: 8083
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: index
              mountPath: /var/lib/synquest
      securityContext:
        fsGroup: 101
      volumes:
        - name: index
          persistentVolumeClaim:
            claimName: synquest-index-local-real-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synquest-index-local-real-demo
  namespace: synanton
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
