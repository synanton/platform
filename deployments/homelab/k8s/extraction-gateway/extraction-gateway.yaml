apiVersion: v1
kind: Service
metadata:
  name: extraction-gateway
  namespace: synanton
spec:
  selector: {app: extraction-gateway}
  ports:
    - {name: grpc, port: 9091}
    - {name: http, port: 8092}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction-gateway
  namespace: synanton
spec:
  replicas: 1
  selector:
    matchLabels: {app: extraction-gateway}
  template:
    metadata:
      labels: {app: extraction-gateway}
    spec:
      imagePullSecrets: [{name: local-registry-cred}]
      nodeSelector: {synanton.io/role: compute}
      containers:
        - name: gateway
          image: local-registry:5000/synanton/extraction-gateway:PLACEHOLDER_TAG
          imagePullPolicy: IfNotPresent
          env:
            - {name: EXTRACTION_DB_URL, value: "jdbc:postgresql://postgres:5432/synanton"}
            - {name: EXTRACTION_DB_USER, value: "synanton"}
            - {name: EXTRACTION_DB_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-cred, key: password}}}
            - {name: EXTRACTION_GATEWAY_GRPC_PORT, value: "9091"}
            - {name: MINIO_ENDPOINT, value: "http://minio:9000"}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: minio-cred, key: user}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: minio-cred, key: password}}}
          ports:
            - {name: grpc, containerPort: 9091}
            - {name: http, containerPort: 8092}
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits:   {cpu: "4", memory: 6Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 10
