apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: synanton
spec:
  selector: {app: postgres}
  ports:
    - {name: pg, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: synanton
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      imagePullSecrets: [{name: local-registry-cred}]
      nodeSelector: {synanton.io/role: cassandra-seed}
      containers:
        - name: postgres
          image: local-registry:5000/synanton/postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - {name: POSTGRES_DB, value: synanton}
            - {name: POSTGRES_USER, value: synanton}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-cred, key: password}}}
          ports:
            - {name: pg, containerPort: 5432}
          resources:
            requests: {cpu: "500m", memory: 1Gi}
            limits:   {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "synanton"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-ssd
        resources: {requests: {storage: 20Gi}}
# postgres-cred (database password) and synanton-jwt (the shared HS256
# secret) are created by deploy.sh from config/.env — `kubectl apply` does
# not interpolate, and secrets are never committed.
