apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-observability
  annotations:
    observability.synanton.io/purpose: "Dedicated 2-replica Longhorn policy for Loki/Grafana; node2/node3 only in practice; no HA claim."
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
