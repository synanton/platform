# Isolated overlay for Local Real Demo v1 (#399). Use with compose.yaml and
# --profile local-real-demo. Explicitly name the small service set to start;
# this profile does not start the unrelated UI, planner, or GPU services.
#
# The three platform images are packaged from host-built boot jars (the
# *.prebuilt.Dockerfile path) so the demo does not depend on buildkit's Maven
# egress. run-local-real-demo.sh builds and tags them before `compose up`.
services:
  postgres:
    profiles: [local-real-demo]
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685

  init-perms:
    profiles: [local-real-demo]

  cassandra:
    profiles: [local-real-demo]
    image: cassandra@sha256:29c6091a2c4e568104e407152f7a449a06a9b6564cbdee6da1b421dcb6681328
    # Base compose publishes 9042 for host-side bench legs; the demo keeps
    # Cassandra internal so it cannot collide with an existing stack.
    ports: !reset []

  minio:
    profiles: [local-real-demo]
    image: chainguard/minio@sha256:709099319add48dfb44aa596a7070d3ddd8dd04d7ae881765719aec29df9e510

  minio-init:
    profiles: [local-real-demo]
    image: chainguard/minio-client@sha256:3d0109d854f045c0158637d6ad0d44fd8a3aef9f0b62082096eb1854c2df8b31

  extraction-gateway:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/extraction-gateway:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    # 9091/8092 are published for an existing stack on developer hosts; the
    # demo reaches the gateway over the Compose network.
    ports: !reset []

  neo4j:
    profiles: [local-real-demo]
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-real-demo-neo4j}
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 256M
    volumes:
      - ${DATA_ROOT:-./data}/neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    ports: !override
      - "${LOCAL_REAL_DEMO_NEO4J_HTTP_PORT:-17474}:7474"
      - "${LOCAL_REAL_DEMO_NEO4J_BOLT_PORT:-17687}:7687"

  neo4j-init:
    profiles: [local-real-demo]
    image: neo4j:5.26
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-real-demo-neo4j}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cypher-shell -a bolt://neo4j:7687 -u neo4j -p "$$NEO4J_PASSWORD"           "CREATE CONSTRAINT entity_identity_unique IF NOT EXISTS FOR (e:Entity) REQUIRE (e.tenant, e.id) IS UNIQUE;
           CREATE CONSTRAINT extracted_mention_unique IF NOT EXISTS FOR (m:ExtractedMention) REQUIRE (m.tenant_id, m.mention_id) IS UNIQUE;
           CREATE CONSTRAINT resolution_slot_unique IF NOT EXISTS FOR (s:ResolutionSlot) REQUIRE (s.tenant_id, s.mention_id) IS UNIQUE;
           CREATE CONSTRAINT relation_evidence_unique IF NOT EXISTS FOR (e:RelationEvidence) REQUIRE e.evidence_id IS UNIQUE;
           CREATE CONSTRAINT canonical_relation_anchor_unique IF NOT EXISTS FOR (a:CanonicalRelationAnchor) REQUIRE a.canonical_relation_id IS UNIQUE;
           CREATE CONSTRAINT extracted_relation_unique IF NOT EXISTS FOR (r:ExtractedRelation) REQUIRE (r.tenant_id, r.relation_id) IS UNIQUE;"
    restart: "no"

  syntology-db-init:
    profiles: [local-real-demo]
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synanton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-synanton}
    command:
      - sh
      - -c
      - |
        export PGPASSWORD="$$POSTGRES_PASSWORD"
        psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tc "SELECT 1 FROM pg_database WHERE datname='syntology'" | grep -q 1           || psql -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -c "CREATE DATABASE syntology"
        psql -h postgres -U "$$POSTGRES_USER" -d syntology -c "CREATE SCHEMA IF NOT EXISTS syntology; CREATE TABLE IF NOT EXISTS syntology.entity_types (version text); CREATE TABLE IF NOT EXISTS syntology.relation_types (version text);"
    restart: "no"

  syntology:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/syntology:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
      init-perms:
        condition: service_completed_successfully
      syntology-db-init:
        condition: service_completed_successfully
    environment:
      SYNTOLOGY_DB_URL: jdbc:postgresql://postgres:5432/syntology
      SYNTOLOGY_DB_USER: ${POSTGRES_USER:-synanton}
      SYNTOLOGY_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SYNTOLOGY_ONTOLOGY_DIR: /data/ontologies
      SYNTOLOGY_JENA_PATH: /var/lib/syntology/tdb2
      SYNANTON_JWT_SECRET: ${SYNANTON_JWT_SECRET:-local-real-demo-secret-at-least-32-bytes}
      SPRING_FLYWAY_LOCATIONS: classpath:db/syntology-migration
      SERVER_PORT: 8080
    volumes:
      - ../../demo-data/ontologies:/data/ontologies:ro
      - ${DATA_ROOT:-./data}/syntology-tdb2:/var/lib/syntology/tdb2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: !override
      - "${LOCAL_REAL_DEMO_SYNTOLOGY_PORT:-18082}:8080"

  relix:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/relix:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    depends_on:
      neo4j:
        condition: service_healthy
      cassandra:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      RELIX_GRAPH_CONNECTOR: neo4j
      RELIX_TENANT: ${LOCAL_REAL_DEMO_TENANT:-local-real-demo}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-real-demo-neo4j}
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_LOCAL_DC: datacenter1
      SYNANTON_JWT_SECRET: ${SYNANTON_JWT_SECRET:-local-real-demo-secret-at-least-32-bytes}
      SYNANTON_ENVELOPE_ENABLED: "false"
      PROMOTION_CONSUMER_ENABLED: ${PROMOTION_CONSUMER_ENABLED:-false}
      PROMOTION_CONSUMER_TENANT: ${LOCAL_REAL_DEMO_TENANT:-local-real-demo}
      RECONCILIATION_ENABLED: ${RECONCILIATION_ENABLED:-false}
      RECONCILIATION_TENANT: ${LOCAL_REAL_DEMO_TENANT:-local-real-demo}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 20
    ports: !override
      - "${LOCAL_REAL_DEMO_RELIX_PORT:-18084}:8084"

  mock-extraction:
    profiles: [local-real-demo]
    image: python:3.12-slim
    command: ["python", "/app/mock_llm_server.py"]
    volumes:
      - ../../scripts/demo/mock_llm_server.py:/app/mock_llm_server.py:ro
      - ../../evaluation/llm-predictions.json:/data/llm-predictions.json:ro
      - ../../evaluation/corpus/halcyon-7-directive.txt:/data/halcyon-7-directive.txt:ro
    environment:
      MOCK_PREDICTIONS: /data/llm-predictions.json
      MOCK_SOURCE: /data/halcyon-7-directive.txt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  synflux:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/synflux:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    environment:
      SYNFLUX_PIPELINE_EMBEDDING_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: ""
      # RAKG Phase 2. Defaults are safe (regex, consumer off); the local E2E
      # enables llm + the consumer via env.
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-regex}
      LLM_EXTRACTION_URL: ${LLM_EXTRACTION_URL:-http://host.docker.internal:8000/v1}
      LLM_EXTRACTION_MODEL: ${LLM_EXTRACTION_MODEL:-qwen3-extraction}
      EXTRACTION_CONSUMER_ENABLED: ${EXTRACTION_CONSUMER_ENABLED:-false}
      EXTRACTION_CONSUMER_TENANT: ${EXTRACTION_CONSUMER_TENANT:-local-real-demo}
      EXTRACTION_GRAPH_ENABLED: ${EXTRACTION_GRAPH_ENABLED:-false}
      SYNTOLOGY_BASE_URL: ${SYNTOLOGY_BASE_URL:-http://syntology:8080}
      RELIX_BASE_URL: ${RELIX_BASE_URL:-http://relix:8084}
      EXTRACTION_GRAPH_ONTOLOGY_VERSION: ${EXTRACTION_GRAPH_ONTOLOGY_VERSION:-active}
      PROMOTION_PRODUCER_ENABLED: ${PROMOTION_PRODUCER_ENABLED:-false}
      PROMOTION_PRODUCER_TENANT: ${PROMOTION_PRODUCER_TENANT:-local-real-demo}
      PROMOTION_PRODUCER_ONTOLOGY_VERSION: ${PROMOTION_PRODUCER_ONTOLOGY_VERSION:-active}
      SYNANTON_JWT_SECRET: ${SYNANTON_JWT_SECRET:-local-real-demo-secret-at-least-32-bytes}
    # The base actuator healthcheck is unauthenticated-deny in this stack;
    # use the service's own /health endpoint instead.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: !override
      - "${LOCAL_REAL_DEMO_SYNFLUX_PORT:-18090}:8090"

  synquest:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/synquest:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    environment:
      SYNQUEST_EMBEDDING_REQUIRED: "false"
      # The C1 E2E uploads via the UI into this tenant; the outbox consumer must
      # poll the same tenant or the new document never reaches the Lucene index.
      SYNQUEST_SEED_DEMO_TENANT: ${LOCAL_REAL_DEMO_TENANT:-local-real-demo}
      SYNQUEST_PROJECTION_ENABLED: "true"
      RELIX_BASE_URL: ${RELIX_BASE_URL:-http://relix:8084}
      SYNANTON_JWT_SECRET: ${SYNANTON_JWT_SECRET:-local-real-demo-secret-at-least-32-bytes}
      RESOLUTION_CONSUMER_ENABLED: ${RESOLUTION_CONSUMER_ENABLED:-false}
      RESOLUTION_CONSUMER_TENANT: ${RESOLUTION_CONSUMER_TENANT:-local-real-demo}
      RESOLUTION_ONTOLOGY_VERSION: ${RESOLUTION_ONTOLOGY_VERSION:-active}
      RESOLUTION_ABSOLUTE_THRESHOLD: ${RESOLUTION_ABSOLUTE_THRESHOLD:-0.01}
      RESOLUTION_MARGIN_THRESHOLD: ${RESOLUTION_MARGIN_THRESHOLD:-0.0001}
      SYNQUEST_DEMO_DENSE_CACHE: /demo-data/eval/retrieval-benchmark/dense-embeddings-v2.json
      SYNQUEST_DEMO_QUERIES: /demo-data/eval/retrieval-benchmark/queries-v2.rb-fixed-g5.jsonl
      SYNQUEST_DEMO_GRAPH: /demo-data/eval/retrieval-benchmark/graph-v2.json
      ONTOLOGY_V2_PATH: /demo-data/eval/retrieval-benchmark/ontology-v2.jsonl
    volumes:
      - ../../demo-data/eval/retrieval-benchmark:/demo-data/eval/retrieval-benchmark:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health | grep -q '\"status\":\"ready\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports: !override
      - "${LOCAL_REAL_DEMO_SYNQUEST_PORT:-18083}:8083"

  security:
    profiles: [local-real-demo]
    image: ${LOCAL_REAL_DEMO_IMAGE_PREFIX:-synanton-local-real-demo}/security:${LOCAL_REAL_DEMO_IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNANTON_JWT_SECRET: ${SYNANTON_JWT_SECRET:-local-real-demo-secret-at-least-32-bytes}
      SECURITY_HTPASSWD_PATH: /etc/synanton/users
      SECURITY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-synanton}
      SECURITY_DB_USER: ${POSTGRES_USER:-synanton}
      SECURITY_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SECURITY_DEMO_ISSUANCE_ENABLED: "true"
    ports: !override
      - "${LOCAL_REAL_DEMO_SECURITY_PORT:-18081}:8081"

networks:
  # The base compose file names this network synanton-demo for the main
  # stack. The demo gets its own network so service aliases and teardown
  # cannot disturb an existing local stack.
  default:
    name: synanton-local-real-demo-network
