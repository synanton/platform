server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://security:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Entity Graph: server-side Relix proxy. The browser never talks to Relix
    # directly. Relix derives tenant scope from the verified bearer token; the
    # client tenant header and tenant query params are stripped. Upstream failures
    # return a generic JSON error, never credentials or upstream stack traces.
    location ~ ^/api/v1/entities/(.*)$ {
        proxy_pass http://relix:8084/v1/entities/$1?;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tenant-ID "";
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @entity_graph_upstream_failed;
    }

    location @entity_graph_upstream_failed {
        internal;
        default_type application/json;
        return 502 '{"error":"upstream_failed"}';
    }

    location /api/ {
        proxy_pass http://syntology:8083/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20M;
    }

    location /topology/ {
        proxy_pass http://topology:8082/topology/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp {
        proxy_pass http://synanton-mcp:8091/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /capabilities {
        proxy_pass http://syntology:8083/capabilities;
        proxy_set_header Host $host;
    }

    location /actuator/ {
        proxy_pass http://syntology:8083/actuator/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
