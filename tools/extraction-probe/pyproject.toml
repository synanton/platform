[project]
name = "extraction-probe"
version = "0.1.0"
description = "CLI to upload a document to the content_extractor extraction-gateway and save its textual response - see README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "grpcio>=1.68",
    "grpcio-tools>=1.68",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
extraction-probe = "extraction_probe.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["extraction_probe*"]

[tool.pytest.ini_options]
pythonpath = ["."]
