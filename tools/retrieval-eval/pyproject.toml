[project]
name = "retrieval-eval"
version = "0.1.0"
description = "Retrieval Evaluation Benchmark harness (SNTP-9 / Issue #14) - see docs/research/retrieval-evaluation-benchmark-plan.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
retrieval-eval = "retrieval_eval.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["retrieval_eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
